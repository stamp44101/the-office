<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ออฟฟิศพิกเซล (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: top-down office floor — a grid of rooms (one per person), each room opens into client columns; a daily-summary tab rolls everything up */
:root{
  --bg:#e8f4ff; --panel:#ffffff; --ink:#1f2a44; --muted:#5a6785; --line:#cfe0f5;
  --accent:#ff4f9a; --accent2:#13c4ae; --accent-ink:#ffffff; --amber:#ffae1a; --danger:#ff4757; --blue:#4c7dff;
  --wall:#36407a; --wallTop:#8fd3ff; --desk:#ff8f4f; --deskTop:#ffbd6b; --screen:#5ef0d2;
  --wood:#ffd28c; --woodB:#f2b763; --chair:#6c63ff; --sofa:#7b5cff; --rug:#13c4ae; --leaf:#2ecc71;
  --tile:#ffffff; --tileAlt:#f2f7ff; --tileLine:#dce8fb;
  --shadow:0 2px 0 rgba(54,64,122,.08),0 10px 24px -14px rgba(54,64,122,.45);
  --f-pixel:"Pixelify Sans","IBM Plex Sans Thai",ui-monospace,monospace;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
/* the game is a deliberate single bright world */
.modal{position:fixed;inset:0;z-index:50;background:rgba(31,42,68,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal-card{position:relative;width:min(980px,100%);margin:auto 0}
.modal-card > div > .panel{border:3px solid var(--wall);box-shadow:0 6px 0 var(--wall)}
.modal-x{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:2px solid var(--wall);background:var(--panel);font-size:20px;line-height:1;font-weight:700;color:var(--wall)}
.setup{max-width:none}
.setup .who{padding-right:40px}
.deco{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px}
#deskPreview{width:240px;height:192px;max-width:100%;image-rendering:pixelated;border-radius:10px;border:3px solid var(--wall);flex:none}
.deco-opts{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.dchip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.dchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.swatch{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);padding:0}
.swatch[aria-pressed="true"]{border-color:var(--wall);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}

.game{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1080px){.game{grid-template-columns:minmax(0,1fr) 280px}}
.stage{display:flex;flex-direction:column;gap:8px;min-width:0}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:4px solid var(--wall);background:var(--wallTop);align-self:stretch;display:flex;justify-content:center}
#map{display:block;image-rendering:pixelated;cursor:crosshair;touch-action:none}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tb-title{font-family:var(--f-pixel);font-weight:700;font-size:18px;color:var(--wall);letter-spacing:.04em}
.tb-on{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tb-on .live{margin:0}
.hud{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stage.big{position:fixed;inset:0;z-index:30;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));overflow:auto}
.stage.big .keys{display:none}
@media (max-height:520px){.stats,.today,.eyebrow{display:none}.brand h1{font-size:18px}.wrap{padding-block:10px 30px;gap:10px}}

.hud button,.hud label{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--wall);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;box-shadow:0 2px 0 var(--wall)}
.hud button[aria-pressed="true"]{background:var(--accent);color:#fff}
.hud input[type=range]{width:70px;accent-color:var(--accent)}
.hud svg{width:14px;height:14px}
.ctrlrow{display:flex;align-items:center;gap:12px;min-height:34px}
.ctrlmid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.prompt{border:2px solid var(--wall);background:var(--amber);color:var(--ink);font-weight:700;font-size:13px;padding:5px 14px;border-radius:999px;box-shadow:0 3px 0 var(--wall);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.emotes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.emotes button{width:36px;height:34px;border:2px solid var(--wall);background:var(--panel);border-radius:10px;font-size:17px;line-height:1;padding:0;box-shadow:0 2px 0 var(--wall)}
.emotes button:active{transform:translateY(2px);box-shadow:none}
.dpad{flex:none;display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:3px}
.dpad button{border:2px solid var(--wall);background:var(--panel);border-radius:9px;font-size:16px;font-weight:700;color:var(--wall);touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 2px 0 var(--wall);padding:0}
.dpad button:active{background:var(--accent2);color:#fff}
@media (hover:hover) and (pointer:fine){.dpad{display:none}}
#bell{position:relative} #bellN:not(:empty){position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:17px;padding:0 4px}
.btn.mini{padding:1px 9px;font-size:12px}
.board-snip{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:96px;overflow:hidden;color:var(--ink)}
.board-snip.empty-b{color:var(--muted)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;font-size:13px}
.feed li{display:flex;gap:6px;align-items:baseline;min-width:0}
.feed li span{min-width:0;overflow-wrap:anywhere}
.feed li time{margin-left:auto;flex:none;font-size:11px;color:var(--muted)}
.feed li.tome{background:color-mix(in srgb,var(--amber) 14%,transparent);border-radius:6px;padding:2px 4px}
.me-card .lvl{display:flex;align-items:center;gap:10px}
.lvbadge{font-family:var(--f-pixel);background:var(--wall);color:#fff;border-radius:6px;padding:1px 8px;font-size:14px;flex:none}
.xpbar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:1}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.me-card small{color:var(--muted);font-size:12px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.mini-chip{font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mini-chip.asg{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
button.mini-chip{cursor:pointer}
.thread{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:8px;background:var(--bg);border-radius:8px}
.thread .c{font-size:13px;overflow-wrap:anywhere} .thread .c b{color:var(--blue);font-size:12px;margin-right:4px} .thread .c time{font-size:11px;color:var(--muted);margin-left:4px}
.thread form{display:flex;gap:6px} .thread input{flex:1;min-width:0}
.task .ai{border:0;background:transparent;font-size:13px;padding:0 2px;line-height:1.5}
.editform select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;font-size:14px;min-width:0;flex:1 1 140px}
.dchip:disabled,.swatch:disabled{opacity:.45;cursor:not-allowed}
.dchip .lk{font-size:11px;margin-left:3px}
.ai-box{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.ai-out{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere;min-height:24px}
.ai-out:empty::before{content:"กดปุ่มด้านบน ให้ AI ช่วยสรุปจากงานจริงในออฟฟิศ";color:var(--muted)}
.room-lv{display:inline-flex;gap:6px;align-items:center;margin-left:6px}
.chatbar{display:flex;gap:8px}
.chatbar input{flex:1;min-width:0;border:2px solid var(--wall);border-radius:12px;padding:9px 14px;font-size:15px;background:var(--panel)}
.chatbar button{border:2px solid var(--wall);background:var(--accent);color:#fff;border-radius:12px;font-weight:700;padding:0 18px;box-shadow:0 3px 0 var(--wall)}
.keys{font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--f-pixel);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);color:var(--ink)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;font-size:12px;color:var(--accent2);font-weight:700}
.count{font-family:var(--f-pixel);background:var(--accent2);color:#fff;border-radius:6px;padding:0 7px;font-size:13px}
#online{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
#online li{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
#online li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#online img,.dot-av{width:22px;height:22px;border-radius:50%;flex:none;background:var(--wallTop)}
.live{width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-left:auto;flex:none;box-shadow:0 0 0 3px rgba(46,204,113,.2)}
#chatlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;font-size:14px}
#chatlog li{display:grid;grid-template-columns:auto 1fr;gap:0 6px;align-items:baseline;min-width:0}
#chatlog li b{color:var(--blue);font-size:13px}
#chatlog li.mine b{color:var(--accent)}
#chatlog li span{overflow-wrap:anywhere;min-width:0}
#chatlog li time{grid-column:2;font-size:11px;color:var(--muted)}
.hint{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--muted);font-size:13px}
.hint i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1480px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-pixel);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand h1{font-size:28px;font-weight:700}
.today{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1 1 140px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:baseline;gap:10px}
.stat b{font-family:var(--f-pixel);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.stat span{color:var(--muted);font-size:13px}
.stat.warn b{color:var(--amber)} .stat.bad b{color:var(--danger)}

/* office floor */
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.room{position:relative;border:0;padding:0;text-align:left;border-radius:6px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.room:hover{transform:translateY(-2px)}
.room.mine{outline:2px solid var(--accent);outline-offset:-2px}
.scene{position:relative;height:150px;border-top:10px solid var(--wall);
  background-color:var(--floorA);
  background-image:linear-gradient(45deg,var(--floorB) 25%,transparent 25%,transparent 75%,var(--floorB) 75%),linear-gradient(45deg,var(--floorB) 25%,transparent 25%,transparent 75%,var(--floorB) 75%);
  background-size:24px 24px;background-position:0 0,12px 12px}
.door{position:absolute;top:-10px;right:22px;width:30px;height:10px;background:var(--floorA)}
.desk{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:120px;height:34px;background:var(--desk);border-radius:3px;box-shadow:inset 0 6px 0 var(--deskTop)}
.monitor{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);width:34px;height:22px;background:var(--wall);border-radius:2px;padding:3px}
.monitor i{display:block;width:100%;height:100%;background:var(--screen)}
.room.busy .monitor i{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.sprite{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);image-rendering:pixelated;width:40px;height:48px;z-index:0}
.desk,.monitor{z-index:1}
.room.busy .sprite{animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translate(-50%,-2px)}}
.room.idle .sprite{left:24%}
.plant{position:absolute;left:12px;bottom:14px;width:16px;height:26px}
.plant::before{content:"";position:absolute;bottom:0;left:2px;width:12px;height:9px;background:var(--desk)}
.plant::after{content:"";position:absolute;bottom:8px;left:0;width:16px;height:16px;background:var(--accent);border-radius:50% 50% 40% 40%}
.mug{position:absolute;bottom:58px;left:calc(24% + 26px);width:9px;height:9px;background:var(--panel);border:2px solid var(--wall);border-radius:0 0 2px 2px}
.bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--panel);color:var(--ink);border:2px solid var(--wall);border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600;z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--wall);border-bottom:0}
.bubble.bad{border-color:var(--danger);color:var(--danger)} .bubble.bad::after{border-top-color:var(--danger)}
.plate{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.plate-head{display:flex;align-items:center;gap:8px;min-width:0}
.plate-head img{width:22px;height:22px;border-radius:50%;flex:none}
.plate-head strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate-head small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip.bad b{color:var(--danger)}
.vacant{border:2px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;min-height:230px;color:var(--muted);gap:6px;padding:16px;text-align:center}
.vacant b{font-family:var(--f-pixel);font-size:30px;color:var(--accent);line-height:1}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.panel-head canvas{image-rendering:pixelated;width:40px;height:48px;background:var(--floorA);border-radius:6px;padding:4px;box-sizing:content-box}
.panel-head .who{display:flex;flex-direction:column;min-width:0}
.panel-head .who h2{font-size:20px}
.panel-head .who span{color:var(--muted);font-size:13px}
.panel-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-head{display:flex;align-items:center;gap:8px}
.col-head h3{font-size:15px;min-width:0;overflow-wrap:anywhere}
.col-head .n{margin-left:auto;font-family:var(--f-pixel);font-size:14px;color:var(--muted)}
.col-head .x{border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:16px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:flex-start;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.task input[type=checkbox]{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .del{border:0;background:transparent;color:var(--muted);font-size:15px;padding:0 2px;line-height:1.4}
.due{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;margin-left:4px;background:var(--bg);color:var(--muted);white-space:nowrap}
.due.today{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.due.late{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.addform{display:flex;flex-wrap:wrap;gap:6px}
.addform input[type=text]{flex:1 1 140px;min-width:0}
input[type=text],input[type=date]{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;font-size:14px}
input[type=date]{flex:0 1 140px;min-width:0}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* setup */
.setup{max-width:620px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:600;font-size:14px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:2px solid var(--line);background:var(--floorA);border-radius:8px;padding:6px}
.pick[aria-pressed="true"]{border-color:var(--accent)}
.pick canvas{display:block;image-rendering:pixelated;width:40px;height:48px}
.pick{background:var(--wallTop)}

/* summary */
.sumbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.group{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.group-head{display:flex;align-items:center;gap:8px;min-width:0}
.group-head img{width:22px;height:22px;border-radius:50%}
.group-head h3{font-size:16px;min-width:0;overflow-wrap:anywhere}
.group-head .counts{margin-left:auto;display:flex;gap:6px;flex:none}
.pill{font-size:12px;font-weight:600;padding:0 7px;border-radius:999px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.pill.warn{color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,transparent)}
.pill.ok{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.lines li{display:flex;gap:6px;align-items:baseline;min-width:0}
.lines li .t{min-width:0;overflow-wrap:anywhere}
.lines .tag{flex:none;font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{font-family:var(--f-pixel);color:var(--accent);font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.task .edt{border:0;background:transparent;color:var(--muted);font-size:13px;padding:0 2px;line-height:1.5}
.task .tn{display:block;font-size:12px;color:var(--muted);white-space:pre-wrap;margin-top:2px}
.task.editing{flex-direction:column;align-items:stretch}
.editform{display:flex;flex-direction:column;gap:6px}
.editform .row{gap:6px}
.editform textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;resize:vertical;min-height:52px}
.archived-note{font-size:12px;color:var(--muted)}
#chatlog li .day{font-size:11px;color:var(--muted);grid-column:1 / -1;text-align:center;margin:4px 0 0}
.chatbar input:disabled{opacity:.6}

.modal-card.narrow{width:min(560px,100%)}
.pbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--wall);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 0 var(--wall);white-space:nowrap}
.pbtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.pbtn.focus-on{background:var(--accent2);color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.item b{font-size:14px}
button.item{background:var(--panel);font:inherit;color:inherit}
button.item:hover{border-color:var(--accent)}
.tracks{display:flex;flex-wrap:wrap;gap:8px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.catcard{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:var(--panel)}
.catcard canvas{image-rendering:pixelated;width:96px;height:64px}
.catcard b{font-size:15px}
.catcard span{font-size:12px;color:var(--muted)}
.mini{border:2px solid var(--line);background:var(--panel);border-radius:9px;padding:3px 10px;font-size:13px;font-weight:600}
.mini.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.panel h2{font-size:20px;padding-right:40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.brand h1{font-size:23px}.panel{padding:14px}}

/* ---------- desk decoration ---------- */
const DESK_COLORS = [["#ff8f4f","#ffbd6b"],["#ff4f9a","#ff9ccc"],["#13c4ae","#7ae8da"],["#8f7bff","#c2b8ff"],["#4c9dff","#9ccaff"],["#a0663c","#c98d5e"],["#c9d3e6","#ffffff"]];

const DECO = {

  lamp:(g,P,x,y) => { R_(g,"#36407a",x+1,y+9,8,2); R_(g,"#36407a",x+4,y+3,2,6); R_(g,"#ff4f9a",x+1,y,8,4); R_(g,"#ffd23f",x+2,y+4,6,1); },
  duck:(g,P,x,y) => { R_(g,"#ffd23f",x+1,y+6,8,5); R_(g,"#ffd23f",x+5,y+3,4,4); R_(g,"#ff8f4f",x+9,y+5,2,2); R_(g,"#1d2b3a",x+7,y+4,1,1); },
  donut:(g,P,x,y) => { R_(g,"#e0a060",x+1,y+5,9,6); R_(g,"#ff6fae",x+1,y+5,9,4); R_(g,"#e0a060",x+4,y+7,3,2); R_(g,"#ffffff",x+3,y+6,1,1); R_(g,"#5ef0d2",x+7,y+6,1,1); R_(g,"#ffd23f",x+5,y+5,1,1); },
  bubble:(g,P,x,y) => { R_(g,"#e8c9a0",x+2,y+3,6,8); R_(g,"#ffffff",x+2,y+2,6,1); R_(g,"#ff4f9a",x+5,y-2,1,5); R_(g,"#3a2a1c",x+3,y+9,1,1); R_(g,"#3a2a1c",x+5,y+8,1,1); R_(g,"#3a2a1c",x+6,y+10,1,1); },

  cat:(g,P,x,y) => { const t = (MAP.anim||0) % 10 < 5; R_(g,"#ff9f43",x+1,y+8,12,7); R_(g,"#ff9f43",x+9,y+5,6,6); R_(g,"#ff9f43",x+9,y+3,2,2); R_(g,"#ff9f43",x+13,y+3,2,2); R_(g,"#e67e22",x+3,y+9,2,5); R_(g,"#e67e22",x+6,y+9,2,5); R_(g,"#1d2b3a",x+11,y+7,1,1); R_(g,"#1d2b3a",x+13,y+7,1,1); R_(g,"#ff9f43",t ? x-2 : x-1, t ? y+10 : y+12, 3, 2); },

function drawDesk(g, P, dx, dy, o){

/* ---------- state ---------- */
const S = {db:null, user:null, room:null, myId:null, rooms:[], profiles:{}, ready:false, noDb:false,
           view:"office", openRoom:null, editing:false, miniModal:null, focus:null, hold:null, brew:null, myCat:null, track:0, tts:false, moveTo:null, setupDesk:null, setupDeco:null, sumMode:"person", setupLook:0, readOnly:false};

const roomStats = r => {
  const tasks = (r.tasks || []);
  const open = tasks.filter(t => !t.done);
  return {
    open: open.length,
    late: open.filter(t => t.due && t.due < TODAY).length,
    today: open.filter(t => t.due === TODAY).length,
    doneToday: tasks.filter(t => t.done && (t.doneAt || "").slice(0,10) === TODAY).length,
  };
};
const AI_ID = "ai";
const nameOf = id => id === AI_ID ? "🤖 Claude" : (S.profiles[id] && S.profiles[id].name) || (id === S.myId ? "คุณ" : "เพื่อนร่วมออฟฟิศ");
const avatarOf = id => (S.profiles[id] && S.profiles[id].avatarUrl) || "";
const myRoom = () => S.rooms.find(r => r.id === S.myId);

/* ---------- data: rooms hold profile/clients/desk; tasks live in their own collection ---------- */
// S.rawRooms: room docs as stored (legacy rooms may still carry a `tasks` array → kept as legacyTasks)
// S.taskDocs: docs from the `tasks` collection. r.tasks is derived (never written back to a room).
S.rawRooms = []; S.taskDocs = []; S.chat = []; S.migrated = false;
const ARCHIVE_DAYS = 30;
const archiveCut = (() => { const d = new Date(); d.setDate(d.getDate() - ARCHIVE_DAYS); return d.toISOString(); })();
const isArchived = t => t.done && t.doneAt && t.doneAt < archiveCut;
function mergeTasks(){
  S.rooms = S.rawRooms.map(r => {
    const own = S.taskDocs.filter(t => t.owner === r.id);
    const ids = new Set(own.map(t => t.id));
    const legacy = (r.legacyTasks || []).filter(t => t && t.id && !ids.has(t.id)).map(t => Object.assign({owner:r.id}, t));
    return Object.assign({}, r, {tasks:[...own, ...legacy]});
  });
  computeProgress();
}
function writeErr(e){
  if (e && e.code === "invalid_argument") { S.readOnly = true; toast("ยังไม่มีสิทธิ์แก้ไข ขอให้เจ้าของออฟฟิศแชร์ให้แบบ Contributor ขึ้นไป"); }
  else if (e && e.code === "quota_exceeded") toast("พื้นที่เก็บข้อมูลเต็ม ลองลบงานเก่าที่ไม่ใช้แล้ว");
  else toast("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
  render();
}

/* ---------- saving (one write at a time) ---------- */
let chain = Promise.resolve();
function saveMine(mutator){
  const cur = S.rawRooms.find(r => r.id === S.myId);
  const next = JSON.parse(JSON.stringify(cur || {}));
  mutator(next);
  next.updatedAt = new Date().toISOString();
  const i = S.rawRooms.findIndex(r => r.id === S.myId);
  const local = Object.assign({id:S.myId}, next);
  if (i >= 0) S.rawRooms[i] = local; else S.rawRooms.push(local);
  mergeTasks(); render();
  const body = Object.assign({}, next); delete body.id; delete body.tasks; delete body.legacyTasks;
  // until migration finishes, keep the legacy array in the doc so nothing is lost
  if (S.migrated !== true && cur && cur.legacyTasks && cur.legacyTasks.length) body.tasks = cur.legacyTasks;
  chain = chain.then(() => S.db.doc("rooms/" + S.myId).set(body)).catch(writeErr);
}
// tasks: optimistic local change, then one queued write
function saveTask(id, patch){
  const i = S.taskDocs.findIndex(t => t.id === id);

/* ---------- game layer: XP, level, streak (derived from finished tasks, nothing extra stored) ---------- */
const XP_BASE = 10, XP_ONTIME = 5;
const levelFor = xp => 1 + Math.floor(Math.sqrt(xp / 40));
const xpForLevel = lv => 40 * (lv - 1) * (lv - 1);
function computeProgress(){
  const by = {};
  S.rooms.forEach(r => (r.tasks || []).forEach(t => {
    if (!t.done || !t.doneAt) return;
    const who = t.doneBy || t.assignee || t.owner || r.id;
    const p = by[who] = by[who] || {xp:0, days:new Set(), done:0};
    p.xp += XP_BASE + (t.due && ymd(new Date(t.doneAt)) <= t.due ? XP_ONTIME : 0);
    p.done++; p.days.add(ymd(new Date(t.doneAt)));
  }));
  // dev cheat: flat XP bonus stored on rooms/<id>.xpBonus (see Alt+Shift+L / Alt+Shift+K)
  (S.rawRooms || []).forEach(r => { const b = Number(r.xpBonus) || 0; if (b > 0) { const p = by[r.id] = by[r.id] || {xp:0, days:new Set(), done:0}; p.xp += b; } });
  const out = {};
  Object.entries(by).forEach(([id, p]) => {
    let streak = 0; const d = new Date();
    if (!p.days.has(ymd(d))) d.setDate(d.getDate() - 1);
    while (p.days.has(ymd(d))) { streak++; d.setDate(d.getDate() - 1); }
    const level = levelFor(p.xp);
    out[id] = {xp:p.xp, level, streak, done:p.done, cur:xpForLevel(level), next:xpForLevel(level + 1)};
  });
  S.prog = out;
}
const progOf = id => (S.prog && S.prog[id]) || {xp:0, level:1, streak:0, done:0, cur:0, next:xpForLevel(2)};

function lerpPath(pts, f){
  let total = 0; const seg = [];

  if (f < restShare || REDUCED) return {x:A.x, y:A.y, pose:restPose, face:hashStr(cat.id + n) % 2 ? "left" : "right"};
  const pts = zoneOf(A) !== zoneOf(B) ? [A, DOOR, B] : [A, B];

/* ---------- movement loop ---------- */
function stepMe(dt){
  const me = MAP.me; if (!me) return;
  let vx = 0, vy = 0;
  const k = MAP.keys, dp = MAP.dpad;
  if (k.has("left") || dp === "left") vx -= 1; if (k.has("right") || dp === "right") vx += 1;
  if (k.has("up") || dp === "up") vy -= 1; if (k.has("down") || dp === "down") vy += 1;
  if ((vx || vy) && me.sit) standUp();
  if ((vx || vy) && S.brew) { S.brew = null; toast("เดินออกมาก่อน เลยไม่ได้เครื่องดื่ม"); sendPresence(true); }
  if (!vx && !vy && MAP.target) {
    const dx = MAP.target.x - me.x, dy = MAP.target.y - me.y, d = Math.hypot(dx, dy);
    if (d < 2) { if (MAP.path && MAP.path.length) MAP.target = MAP.path.shift(); else { MAP.target = null; const cb = MAP.onArrive; MAP.onArrive = null; if (cb) cb(); } }
    else { vx = dx / d; vy = dy / d; }
  }
  let moved = false;
  if (vx || vy) {
    const n = Math.hypot(vx, vy); vx /= n; vy /= n;
    const sp = 80 * dt, nx = me.x + vx * sp, ny = me.y + vy * sp;
    if (!blocked(nx, me.y)) { me.x = nx; moved = true; }
    if (!blocked(me.x, ny)) { me.y = ny; moved = true; }
    if (!moved && MAP.target) { // slide around obstacles
      const alt = [[vy, -vx], [-vy, vx]];
      for (const [ax, ay] of alt) { if (!blocked(me.x + ax * sp, me.y + ay * sp)) { me.x += ax * sp; me.y += ay * sp; moved = true; break; } }
      if (!moved) { MAP.target = null; MAP.onArrive = null; }
    }
    me.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? "left" : "right") : (vy < 0 ? "up" : "down");
  }
  me.moving = moved;
  updatePrompt();
  sendPresence();
}
function presenceState(){
  const me = MAP.me;
  return {x:Math.round(me.x), y:Math.round(me.y), dir:me.dir, mv:me.moving ? 1 : 0, look:myLook(), uid:S.myId || null,
    sit:me.sit || null, focus:S.focus ? S.focus.until : null, hold:S.hold && Date.now() < S.hold.until ? S.hold.id : null, brewing:S.brew && Date.now() < S.brew.until ? 1 : null, cat:S.myCat || null};
}
function sendPresence(force){
  if (!S.room || !MAP.me) return;
  const p = presenceState(), key = JSON.stringify(p);
  if (!force && key === MAP.lastSent) return;
  MAP.lastSent = key;
  S.room.presence(p).catch(() => {});
}
function stepRemote(dt){
  Object.values(MAP.remote).forEach(r => {
    const dx = r.tx - r.x, dy = r.ty - r.y, d = Math.hypot(dx, dy);
    if (d > 80) { r.x = r.tx; r.y = r.ty; }
    else if (d > .5) { const s = Math.min(d, 110 * dt); r.x += dx / d * s; r.y += dy / d * s; }
    r.moving = r.mv || d > 1;
  });
}
function loop(t){
  requestAnimationFrame(loop);
  if (!MAP.canvas || document.hidden || S.view !== "office") { MAP.prevT = t; return; }
  const dt = Math.min(.05, (t - (MAP.prevT || t)) / 1000); MAP.prevT = t;
  ANIM = Math.floor(t / 110); MAP.anim = ANIM; MAP.last = t;
  if (S.hold && Date.now() > S.hold.until) { S.hold = null; sendPresence(true); }
  stepMe(dt); stepRemote(dt); stepCats(dt, Date.now()); checkFocus(); draw();
  if (S.focus && ANIM % 9 === 0) renderToolbar();
}

/* room: who's here + chat bubbles */
function connectRoom(room){
  S.room = room;
  room.onPeers(async ch => {
    const seen = new Set();
    ch.peers.forEach(p => {
      if (p.isMe && p.sameTab) { S.myPeer = p.peer; return; }
      if (p.kind !== "viewer" || p.sameTab) return;
      const pr = p.presence || {};
      if (typeof pr.x !== "number" || typeof pr.y !== "number") return;
      seen.add(p.peer);
      let r = MAP.remote[p.peer];
      if (!r) r = MAP.remote[p.peer] = {x:pr.x, y:pr.y, tx:pr.x, ty:pr.y, sayKey:null};
      r.tx = Math.max(0, Math.min(MAP.w, pr.x)); r.ty = Math.max(0, Math.min(MAP.h, pr.y));
      r.dir = ["up","down","left","right"].includes(pr.dir) ? pr.dir : "down";
      r.mv = !!pr.mv; r.look = Math.abs(Number(pr.look) | 0) % LOOKS.length;
      r.by = p.by || (typeof pr.uid === "string" ? pr.uid : null);
      r.isMe = p.isMe;
      r.sit = typeof pr.sit === "string" ? pr.sit : null;
      r.focus = typeof pr.focus === "number" ? pr.focus : null;
      r.hold = typeof pr.hold === "string" && (drinkOf(pr.hold) || snackOf(pr.hold)) ? pr.hold : null; r.brewing = !!pr.brewing; r.cat = typeof pr.cat === "string" ? pr.cat : null;
      const say = pr.say;
      if (say && typeof say.t === "string" && say.at !== r.sayKey) {
        r.sayKey = say.at;
        const text = clean(say.t, 80);
        if (r.sayInit) { r.say = text; r.sayAt = Date.now(); if (!S.db && !say.emo) pushChat(r.by, text, false); }
        else if (Date.now() - Number(say.at) < 7000) { r.say = text; r.sayAt = Date.now(); }
      }
      r.sayInit = true;
    });
    Object.keys(MAP.remote).forEach(k => { if (!seen.has(k)) delete MAP.remote[k]; });
    if (S.user) { const ids = [...onlineIds()]; try { const ps = await S.user.profiles(ids); Object.assign(S.profiles, ps); } catch {} }
    renderSide();
  }, () => { renderSide(); });
  room.onConnection(() => renderSide(), () => {});
  sendPresence(true);
}

const TRACKS = [
  {name:"โลไฟชิปทูน", bpm:82, chords:[[48,52,55,59],[45,48,52,55],[41,45,48,52],[43,47,50,55]], lead:"square", arp:[0,1,2,3,2,1,2,3], hat:true},
  {name:"คาเฟ่แจ๊ส", bpm:72, chords:[[50,53,57,60],[43,47,50,53],[48,52,55,59],[45,49,52,55]], lead:"triangle", arp:[0,2,1,3,0,2,3,1], hat:true, swing:.18},
  {name:"ฝนตกเบาๆ", bpm:60, chords:[[45,48,52,55],[41,45,48,52],[48,52,55,59],[43,47,50,55]], lead:"sine", arp:[3,-1,2,-1,1,-1,0,-1], rain:true},
];
const MUSIC = {ctx:null, on:false, timer:0, step:0, next:0, master:null, vol:.5, rain:null};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function note(type, freq, t, dur, gain, filt){
  const c = MUSIC.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + Math.min(.02, dur/4)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let node = o;
  if (filt) { const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = filt; o.connect(f); node = f; }
  node.connect(g); g.connect(MUSIC.master); o.start(t); o.stop(t + dur + .05);
}
function noiseBuf(sec){ const c = MUSIC.ctx, b = c.createBuffer(1, c.sampleRate * sec, c.sampleRate), d = b.getChannelData(0); for (let j = 0; j < d.length; j++) d[j] = Math.random() * 2 - 1; return b; }
function schedule(){
  const c = MUSIC.ctx, tr = TRACKS[S.track], spb = 60 / tr.bpm / 2;
  while (MUSIC.next < c.currentTime + .15) {
    const s = MUSIC.step, i = s % 8, t = MUSIC.next + (tr.swing && i % 2 ? spb * tr.swing : 0), ch = tr.chords[Math.floor(s / 8) % 4];
    if (i === 0) ch.forEach(n => note("triangle", mtof(n), t, spb * 8.2, tr.rain ? .035 : .05, 900));
    if (!tr.rain && (i === 0 || i === 4)) note("sine", mtof(ch[0] - 12), t, spb * 3, .16, 400);
    const a = tr.arp[i]; if (a >= 0 && i !== 7) note(tr.lead, mtof(ch[a] + 12), t, spb * (tr.rain ? 2.5 : .9), tr.lead === "square" ? .02 : .04, 2400);
    if (tr.hat && i % 2 === 1) { const src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6500; g.gain.setValueAtTime(.03, t); g.gain.exponentialRampToValueAtTime(.0001, t + .05); src.buffer = MUSIC.hatBuf; src.connect(f); f.connect(g); g.connect(MUSIC.master); src.start(t); src.stop(t + .06); }
    MUSIC.next += spb; MUSIC.step++;
  }
}
function startRain(on){
  if (MUSIC.rain) { try { MUSIC.rain.stop(); } catch {} MUSIC.rain = null; }
  if (!on) return;
  const c = MUSIC.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = noiseBuf(3); src.loop = true; f.type = "lowpass"; f.frequency.value = 1400; g.gain.value = .06;
  src.connect(f); f.connect(g); g.connect(MUSIC.master); src.start(); MUSIC.rain = src;
}
function setMusic(on, track){
  try {
    if (!MUSIC.ctx) { MUSIC.ctx = new (window.AudioContext || window.webkitAudioContext)(); MUSIC.master = MUSIC.ctx.createGain(); MUSIC.master.gain.value = 0; MUSIC.master.connect(MUSIC.ctx.destination); MUSIC.hatBuf = noiseBuf(.05); }
    if (track != null) { S.track = track; MUSIC.step = 0; }
    MUSIC.on = on;
    clearInterval(MUSIC.timer);
    if (on) { MUSIC.ctx.resume(); MUSIC.master.gain.setTargetAtTime(MUSIC.vol * .6, MUSIC.ctx.currentTime, .3); MUSIC.next = MUSIC.ctx.currentTime + .05; MUSIC.timer = setInterval(schedule, 30); startRain(!!TRACKS[S.track].rain); }
    else { MUSIC.master.gain.setTargetAtTime(0, MUSIC.ctx.currentTime, .15); startRain(false); }
  } catch { toast("เบราว์เซอร์นี้เล่นเพลงไม่ได้"); MUSIC.on = false; }
  renderToolbar();
}
function setVol(v){ MUSIC.vol = v; if (MUSIC.ctx && MUSIC.on) MUSIC.master.gain.setTargetAtTime(v * .6, MUSIC.ctx.currentTime, .1); }

    drawPreview(); return;
  }
  if (t.classList.contains("pick")) { S.setupLook = +t.dataset.look; document.querySelectorAll(".pick").forEach(b => b.setAttribute("aria-pressed", b === t)); drawPreview(); return; }
  if (t.dataset.mode) { S.sumMode = t.dataset.mode; return render(); }
  if (t.id === "copy") {
    const txt = summaryText();
    try { navigator.clipboard.writeText(txt).then(() => toast("คัดลอกแล้ว วางในแชทได้เลย"), () => fallbackCopy(txt)); } catch { fallbackCopy(txt); }
    return;
  }
  if (t.dataset.toggle) {
    const id = t.dataset.toggle, k = allTasks().find(x => x.id === id); if (!k || !canTouch(k)) return;
    const done = !k.done, before = progOf(S.myId).level;
    saveTask(id, {done, doneAt: done ? new Date().toISOString() : null, doneBy: done ? S.myId : null});
    if (done) {
      logAct("done", `ปิดงาน "${k.title}" (${clientName(k)})`, [k.owner, k.assignee]);
      const after = progOf(S.myId).level;
      toast(after > before ? `🎉 เลเวลอัป! ตอนนี้ Lv.${after} ปลดล็อกของแต่งโต๊ะใหม่แล้ว` : `+${XP_BASE + (k.due && TODAY <= k.due ? XP_ONTIME : 0)} XP`);
      if (MAP.me) { MAP.me.say = "🎉"; MAP.me.sayAt = Date.now(); }
    }
    return;
  }
  if (t.dataset.edit) { S.editTask = t.dataset.edit; render(); const i = document.querySelector(".editform input[name=title]"); if (i) i.focus(); return; }
  if (t.dataset.canceledit) { S.editTask = null; return render(); }
  if (t.dataset.del) {
    if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "ลบ?"; setTimeout(() => { t.dataset.armed = ""; t.textContent = "×"; }, 2500); return; }
    return deleteTasks([t.dataset.del]);
  }
  if (t.dataset.rmclient) {
    const id = t.dataset.rmclient;
    if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "ลบ?"; setTimeout(() => { t.dataset.armed = ""; t.textContent = "×"; }, 2500); return; }
    const ids = ((myRoom() || {}).tasks || []).filter(x => x.clientId === id).map(x => x.id);
    saveMine(r => { r.clients = r.clients.filter(c => c.id !== id); });
    return deleteTasks(ids);
  }
});
function fallbackCopy(txt){
  const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("คัดลอกแล้ว"); } catch { toast("คัดลอกไม่ได้ ลองเลือกข้อความเอง"); } ta.remove();
}
document.addEventListener("input", e => { if (e.target.id === "vol") setVol(+e.target.value); });
document.addEventListener("pointerdown", e => { const b = e.target.closest(".dpad button"); if (b) { MAP.dpad = b.dataset.dir; MAP.target = null; MAP.path = null; MAP.onArrive = null; b.setPointerCapture && b.setPointerCapture(e.pointerId); e.preventDefault(); } });
["pointerup","pointercancel"].forEach(ev => document.addEventListener(ev, () => { MAP.dpad = null; }));
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "devLvForm") { setLevel(f.elements.lv.value); f.reset(); return render(); }
  if (f.id === "chatbar") { const i = $("#say"); say(i.value); i.value = ""; return; }
  if (f.id === "setup") {
    const name = $("#f-name").value.trim();
    const newClients = $("#f-clients").value.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
    const isNew = !myRoom();
    saveMine(r => {
      if (isNew) { r.joinedAt = new Date().toISOString(); r.clients = []; r.desk = S.setupDesk; }
      r.roomName = name; r.avatar = S.setupLook; r.deco = Object.assign({}, S.setupDeco || DEFAULT_DECO);
      newClients.forEach(n => { if (!r.clients.some(c => c.name.toLowerCase() === n.toLowerCase())) r.clients.push({id:uid(), name:n}); });
    });
    if (isNew) logAct("join", `ย้ายเข้าออฟฟิศ${name ? " ห้อง " + name : ""} 👋`, members());
    S.editing = false; S.setupDesk = null; S.openRoom = S.myId; toast(isNew ? "จองโต๊ะแล้ว ยินดีต้อนรับเข้าออฟฟิศ" : "บันทึกแล้ว"); return render();
  }
  if (f.dataset.edittask) {
    const id = f.dataset.edittask, title = f.elements.title.value.trim();
    if (!title) return;
    const prev = allTasks().find(x => x.id === id) || {}, asg = f.elements.assignee ? (f.elements.assignee.value || null) : (prev.assignee || null);
    S.editTask = null;
    saveTask(id, {title, due: f.elements.due.value || null, note: f.elements.note.value.trim().slice(0, 600), assignee: asg});
    if (asg === AI_ID && prev.assignee !== AI_ID) { logAct("assign", `ส่งงาน "${title}" ให้ 🤖 Claude ช่วยทำ`); openAITask(id); return; }
    if (asg && asg !== prev.assignee) { logAct("assign", `มอบงาน "${title}" ให้ ${nameOf(asg)}`, [asg]); toast(`มอบงานให้ ${nameOf(asg)} แล้ว`); }
    else if (!asg && prev.assignee) logAct("assign", `ดึงงาน "${title}" กลับมาทำเอง`, [prev.assignee]);
    return;
  }
  if (f.id === "aiBriefForm") {
    const k = allTasks().find(x => x.id === S.aiTask); if (!k || !canTouch(k)) return;
    const brief = f.elements.brief.value.trim().slice(0, 4000);
    const answers = [...f.querySelectorAll("[data-q]")].map(i => ({q:i.dataset.q, a:i.value.trim()})).filter(x => x.a);
    const prevAns = (k.ai && k.ai.answers) || [];
    saveTask(k.id, {ai:Object.assign({}, k.ai || {}, {brief, answers:[...prevAns, ...answers].slice(-20)})});
    aiCheck(answers.length > 0 && S.aiRun && S.aiRun.round >= 1);
    return;
  }
  if (f.id === "aiRefineForm") { const v = f.elements.req.value.trim(); if (v) aiRefine(v.slice(0, 1000)); return; }
  if (f.dataset.comment) {
    const id = f.dataset.comment, inp = f.querySelector("input"), text = inp.value.replace(/\s+/g, " ").trim().slice(0, 300);
    const k = allTasks().find(x => x.id === id); if (!text || !k || !canWrite()) return;
    const comments = [...(k.comments || []), {id:uid(), by:S.myId, text, at:Date.now()}].slice(-50);
    saveTask(id, {comments});
    const ments = mentionsIn(text);
    logAct("comment", `คอมเมนต์ในงาน "${k.title}": ${text}`, [k.owner, k.assignee, ...ments]);
    setTimeout(() => { const i = document.querySelector(`form[data-comment="${CSS.escape(id)}"] input`); if (i) i.focus(); }, 0);
    return;
  }
  if (f.id === "boardForm") { if (!canWrite()) return; saveBoard(f.elements.text.value.slice(0, 2000)); S.openBoard = false; toast("บันทึกกระดานแล้ว"); return render(); }
  if (f.dataset.add) {
    const cid = f.dataset.add;
    const title = f.querySelector("input[type=text]").value.trim();
    const due = f.querySelector("input[type=date]").value || null;
    if (!title) return;
    saveTask(uid() + uid(), {owner:S.myId, clientId:cid, title, due, note:"", done:false, doneAt:null, createdAt:new Date().toISOString()});
    const cl = ((myRoom() || {}).clients || []).find(c => c.id === cid);
    logAct("add", `เพิ่มงาน "${title}"${cl ? " ให้ " + cl.name : ""}`);
    setTimeout(() => { const i = document.getElementById("t-" + cid); if (i) i.focus(); }, 0);
  }
});

/* ---------- boot ---------- */
render();
(async () => {
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n) : Promise.resolve(null);
  const [db, user, room] = await Promise.all([use("db"), use("user"), use("room")]);
  if (room) { try { connectRoom(room); } catch (e) { S.room = null; } }
  if (!db) { S.noDb = true; return render(); }
  S.db = db; S.user = user;
  S.myId = user ? await user.id() : null;
  if (user) { const w = await user.can("data.write"); if (w === false) S.readOnly = true; }
  // keep typing intact: don't re-render while an input is focused
  const softRender = () => {
    const a = document.activeElement;
    if (a && a.matches && a.matches(".addform input, #setup input, #say, .editform input, .editform textarea, .editform select, form[data-comment] input, #aiPanel textarea, #aiPanel input")) { renderStats(); if (MAP.canvas) layoutMap(); return; }
    render();
  };
  db.collection("rooms").onSnapshot(async snap => {
    S.rawRooms = snap.docs.map(d => {
      const data = Object.assign({}, d.data()); const legacy = Array.isArray(data.tasks) ? data.tasks : [];
      delete data.tasks; return Object.assign({id:d.id}, data, {legacyTasks:legacy});
    });
    mergeTasks();
    S.ready = true;
    if (user) {
      const ids = S.rooms.map(r => r.id); if (S.myId) ids.push(S.myId);
      try { S.profiles = await user.profiles(ids); } catch {}
    }
    softRender();
    migrateMine();
  }, err => { S.ready = true; toast("เชื่อมต่อออฟฟิศไม่ได้ ลองเปิดหน้าใหม่"); render(); });
  db.collection("tasks").onSnapshot(snap => {
    S.taskDocs = snap.docs.map(d => Object.assign({}, d.data(), {id:d.id})).filter(t => typeof t.owner === "string" && typeof t.title === "string");
    mergeTasks(); softRender();
  }, () => toast("โหลดงานไม่สำเร็จ ลองเปิดหน้าใหม่"));
  db.collection("activity").orderBy("at", "desc").limit(60).onSnapshot(snap => {
    S.acts = snap.docs.map(d => d.data()).filter(a => a && typeof a.text === "string" && typeof a.at === "number" && typeof a.by === "string");
    renderSide(); if (S.openInbox) render();
  }, () => {});
  db.doc("board/main").onSnapshot(d => {
    const b = d.data(); S.board = b && typeof b.text === "string" ? b : null;
    renderExtras(); if (S.openBoard && !document.querySelector("#boardForm")) render();
  }, () => {});
  db.collection("chat").orderBy("at", "desc").limit(60).onSnapshot(snap => {
    const prevAt = S.chatReady && S.chat.length ? S.chat[S.chat.length - 1].at : Date.now();
    S.chat = snap.docs.map(d => d.data()).filter(m => m && typeof m.text === "string" && typeof m.at === "number").reverse();
    if (S.tts && S.chatReady) S.chat.filter(m => m.at > prevAt && m.by !== S.myId).forEach(m => speak(`${m.by ? nameOf(m.by) : "ผู้มาเยือน"} บอกว่า ${m.text}`));
    S.chatReady = true; renderSide();
  }, () => {});
})();
})();
</script>
